name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest
          # The Dune Developer Preview does not currently support MINGW64_NT-10.0-26100 x86_64.
        ocaml-compiler:
          - 5.4.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use dune
        uses: ocaml-dune/setup-dune@v1

      - name: Lock dependencies
        run: dune pkg lock

      - name: Build
        run: dune build

      - name: Run tests
        run: dune runtest

  opam-lint:
    runs-on: ubuntu-latest

    env:
      OPAMYES: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Install dune-release
        run: opam install dune-release

      - name: Lint release metadata
        uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: toon
