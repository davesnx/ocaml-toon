name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  # Run from a tag in the Actions UI to test or redo a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without publishing'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest
          # The Dune Developer Preview does not currently support MINGW64_NT-10.0-26100 x86_64.
        ocaml-compiler:
          - 5.4.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use dune
        uses: ocaml-dune/setup-dune@v1

      # Toolchain, shared build cache, and the opam-repository mirror.
      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ hashFiles('dune.lock/**', '.github/release-tools/dune.lock/**') }}
          restore-keys: |
            dune-${{ runner.os }}-

      - name: Lock dependencies
        run: dune pkg lock

      - name: Build
        run: dune build

      - name: Run tests
        run: dune runtest

      # Release tooling, ubuntu only. dune-release is built with dune package
      # management from .github/release-tools. opam is needed only as a binary
      # because dune-release-action runs `opam exec -- dune-release`.
      - name: Build dune-release
        if: matrix.os == 'ubuntu-latest'
        run: |
          dune build --root .github/release-tools @pkg-install
          dirname "$(find .github/release-tools/_build/_private -type f -name dune-release -path '*/target/bin/*')" >> "$GITHUB_PATH"

      - name: Install opam binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam
          opam init --bare -n --disable-sandboxing
          opam switch create default --empty

      - name: Lint release metadata
        if: matrix.os == 'ubuntu-latest'
        uses: davesnx/dune-release-action/lint@v0.5.0
        with:
          packages: toon

      # dune-release rebuilds the archive with `dune build -p`, which disables
      # dune package management, so expose the toolchain and the locked
      # libraries that `dune build` already produced above.
      - name: Expose the dune toolchain to dune-release
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          dirname "$(find ~/.cache/dune/toolchains "$PWD/_build/_private" -name ocamlc -path '*/target/bin/*' 2>/dev/null | head -1)" >> "$GITHUB_PATH"
          echo "OCAMLPATH=$(find "$PWD/_build/_private/default/.pkg" -mindepth 2 -maxdepth 3 -type d -path '*/target/lib' | tr '\n' ':' | sed 's/:$//')" >> "$GITHUB_ENV"

      - name: Release to GitHub and opam
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: toon
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
