name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      dry_run:
        description: 'Validate the release without publishing'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      OPAMYES: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Install dune-release
        run: opam install dune-release

      - name: Release to GitHub and opam
        uses: davesnx/dune-release-action@v0.5.0
        with:
          packages: toon
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
